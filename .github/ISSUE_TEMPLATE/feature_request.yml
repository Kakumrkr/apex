name: Feature request
description: Suggest an improvement to Apex
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Which part of Apex is it in (prompt/skill, apex.py, hooks)? Judgment belongs in prompts; anything mechanical belongs in the CLI.
