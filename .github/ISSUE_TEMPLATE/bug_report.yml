name: Bug report
description: Something in Apex didn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Security issue?** Please use private vulnerability reporting instead (see SECURITY.md)."
  - type: input
    id: versions
    attributes:
      label: Versions
      description: Output of `claude --version`, `python3 --version`, and the Apex version (`apex.py version`)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["/apex:init", "/apex:audit", "/apex:run-session", "/apex:status", "/apex:defer", "hooks / guards", "apex.py CLI", "Codex install", "docs"]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include `apex.py lint` output if relevant. Remove any secrets.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
